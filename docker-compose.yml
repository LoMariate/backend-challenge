services:
  postgres:
    image: postgres:16
    container_name: backend-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
      POSTGRES_DB: backend_challenge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend_challenge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: